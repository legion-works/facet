<!doctype html>
<!--
  Recovery family: implied end tags. The HTML spec closes <p> when a new
  block-level start tag arrives, and closes <li> when the next <li> starts.
  This fixture proves the recovery fires by stacking several such pairs:
  a bare <p> followed by another <p>, and <li> items without explicit close.
  If implied-end-tag recovery is skipped, the inner content becomes nested
  and Chromium's tree diverges from parse5's.
-->
<html>
  <body>
    <h1>Implied end tags</h1>
    <p>first paragraph</p>
    <p>second paragraph (the previous <code>p</code> closes by implication here)</p>
    <ul>
      <li>first item</li>
      <li>second item (the previous <code>li</code> closes by implication here)</li>
      <li>third item</li>
    </ul>
    <table>
      <tr>
        <td>
          cell one
          <tr>
            <td>
              cell two (the previous <code>tr</code> and <code>td</code> close by implication)
            </td>
          </tr>
        </td>
      </tr>
    </table>
  </body>
</html>

<!doctype html>
<html>
  <body>
    <h1>Implied end tags</h1>
    <p>first paragraph
    <p>second paragraph (implied end tag closes the first <code>p</code>)
    <p>third paragraph
    <ul>
      <li>bullet one
      <li>bullet two (implied close of <code>li</code> before next <code>li</code>)
      <li>bullet three
    </ul>
    <table>
      <tr><td>cell one
      <tr><td>cell two (implied close of <code>tr</code> and <code>td</code>)
    </table>
  </body>
</html>

<!doctype html>
<!--
  Recovery family: adoption agency. Active formatting elements (<b>, <i>)
  get reconstructed when a later block breaks an inner one. The HTML spec
  closes the inner element by adoption agency (it pops from the active
  list and re-opens with reconstructed ancestors). Chromium and parse5
  both implement this identically — this fixture proves the recovery fires
  by nesting <b><i> with the WRONG end-tag order.
-->
<html>
  <body>
    <h1>Adoption agency probe</h1>
    <p><b><i>bold-then-italic fragment ends here without closing italic</b>
    <p><i><b>italic-then-bold fragment ends here without closing bold</i>
    <ul><li>list after formatting reconstruction</li></ul>
  </body>
</html>

<svg xmlns="http://www.w3.org/2000/svg" width="9000" height="500" viewBox="0 0 9000 500">
  <style>
    @keyframes evidence-marker {
      from { transform: translateX(0); fill: #00ff00; }
      to { transform: translateX(400px); fill: #ffff00; }
    }
    .evidence-marker { animation: evidence-marker 600ms linear infinite alternate; }
    @media (prefers-reduced-motion: reduce) {
      .evidence-marker { animation: none; transform: translateX(0); fill: #00ff00; }
    }
  </style>
  <rect x="0" y="0" width="80" height="500" fill="#ff0000" />
  <rect x="8920" y="0" width="80" height="500" fill="#0000ff" />
  <rect class="evidence-marker" x="400" y="180" width="80" height="80" />
</svg>

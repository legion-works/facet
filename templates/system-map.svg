<svg xmlns="http://www.w3.org/2000/svg" width="960" height="540" viewBox="0 0 960 540" role="img" aria-label="artifact delivery system map">
  <rect width="960" height="540" rx="20" fill="#16161e"></rect>

  <g transform="translate(56 48)">
    <text font-family="ui-monospace, Menlo, monospace" font-size="12" letter-spacing="3" fill="#86e1fc">ARTIFACT DELIVERY</text>
    <text y="42" font-family="system-ui, sans-serif" font-size="28" font-weight="600" fill="#e6ecff">Verification path</text>
    <text y="70" font-family="system-ui, sans-serif" font-size="14" fill="#737aa2">Bytes stay isolated until a verifier records the rendered result.</text>
  </g>

  <g fill="none" stroke="#545c7e" stroke-width="2">
    <path d="M 250 264 H 340"></path>
    <path d="M 510 264 H 600"></path>
    <path d="M 770 264 H 824"></path>
  </g>
  <g fill="#86e1fc">
    <circle cx="340" cy="264" r="4"></circle>
    <circle cx="600" cy="264" r="4"></circle>
    <circle cx="824" cy="264" r="4"></circle>
  </g>

  <g transform="translate(56 196)">
    <rect width="194" height="136" rx="12" fill="#1e2030" stroke="#3b4261"></rect>
    <text x="24" y="38" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#86e1fc">01 · SOURCE</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#c8d3f5">Artifact bytes</text>
    <text x="24" y="106" font-family="system-ui, sans-serif" font-size="13" fill="#737aa2">Immutable revision</text>
  </g>

  <g transform="translate(340 196)">
    <rect width="170" height="136" rx="12" fill="#1e2030" stroke="#3b4261"></rect>
    <text x="24" y="38" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#86e1fc">02 · TIER 0</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#c8d3f5">Policy</text>
    <text x="24" y="106" font-family="system-ui, sans-serif" font-size="13" fill="#737aa2">Lexical checks</text>
  </g>

  <g transform="translate(600 196)">
    <rect width="170" height="136" rx="12" fill="#1e2030" stroke="#3b4261"></rect>
    <text x="24" y="38" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#86e1fc">03 · TIER 1</text>
    <text x="24" y="76" font-family="system-ui, sans-serif" font-size="20" font-weight="600" fill="#c8d3f5">Browser</text>
    <text x="24" y="106" font-family="system-ui, sans-serif" font-size="13" fill="#737aa2">Observed structure</text>
  </g>

  <g transform="translate(824 196)">
    <rect width="80" height="136" rx="12" fill="#18231b" stroke="#c3e88d"></rect>
    <text x="40" y="58" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#c3e88d">OK</text>
    <text x="40" y="84" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#c3e88d">✓</text>
  </g>

  <g transform="translate(56 408)">
    <rect width="848" height="76" rx="12" fill="#1e2030" stroke="#3b4261"></rect>
    <text x="24" y="30" font-family="ui-monospace, Menlo, monospace" font-size="11" fill="#545c7e">INVARIANT</text>
    <text x="24" y="56" font-family="system-ui, sans-serif" font-size="15" fill="#c8d3f5">A gallery view identifies an exact revision; verification remains a separate recorded verdict.</text>
  </g>
</svg>

name: security-egress

# The egress-penetration gate needs unprivileged user/net namespaces AND a
# routable sink, so it only runs on a self-hosted runner. Until one is
# registered, `push`/`pull_request` triggers would queue a check that never
# completes and block every merge — 43 runs, 0 completions before this change.
# Manual + scheduled triggers keep the gate real without gating the queue: it
# runs the moment a runner exists, and `workflow_dispatch` proves it on demand.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

jobs:
  security-egress:
    # Named runner is required because user/net namespaces are a hard prerequisite.
    runs-on: [self-hosted, linux]
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # v2.0.2 — 735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # actions/cache v4.3.0 — 0057852bfaa89a56745cba8c7296529d2fc39830 (<= v4.1.x hard-fails at job setup: deprecated cache toolkit, 2024-12-05 deprecation)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-headless-shell-131.0.6778.204
      - name: install pinned chrome-headless-shell
        run: bunx --bun puppeteer browsers install chrome-headless-shell@131.0.6778.204
      - name: detect relevant security paths
        id: paths
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            range="${{ github.event.pull_request.base.sha }}...${{ github.event.pull_request.head.sha }}"
          elif [[ "${{ github.event.before }}" =~ ^0+$ ]]; then
            range="HEAD^..${{ github.sha }}"
          else
            range="${{ github.event.before }}..${{ github.sha }}"
          fi
          if git diff --name-only "$range" | grep -Eq '^(scripts/(launch-netns\.sh|egress-penetration\.ts)|src/(gallery-web/.+|validation/.+|service/security/.+)|src/.*/(frame-html|token[^/]*)\.ts|tests/acceptance/(egress|gate-forgery)\.test\.ts|\.github/workflows/security-egress\.yml)$'; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          else
            echo "relevant=false" >> "$GITHUB_OUTPUT"
          fi
      - name: prove rootless network namespace support
        if: steps.paths.outputs.relevant == 'true'
        run: unshare --map-current-user --net -- true
      - name: run full egress and forgery gates
        if: steps.paths.outputs.relevant == 'true'
        run: |
          bun test tests/acceptance/egress.test.ts tests/acceptance/gate-forgery.test.ts
          echo "security-egress: 0 leaks"
      - name: unrelated paths are a successful required check
        if: steps.paths.outputs.relevant != 'true'
        run: "echo 'security-egress: paths irrelevant; gate passed without skipping the required status'"

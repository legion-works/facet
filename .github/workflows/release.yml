name: release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Publish an existing release tag
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.2.0 — a02a34c4d625f9be7cb89156071d8567266a2445
      - id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445
        with:
          release-type: node
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v2.0.2 — 735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: build release archives and pinned browser manifest
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/browser
          tar -czf "release-assets/facet-${RELEASE_TAG}-source.tar.gz" --exclude=.git --exclude=release-assets .
          tar -czf "release-assets/facet-${RELEASE_TAG}-gallery.tar.gz" dist/gallery
          curl -fsSL -o release-assets/browser/chrome-headless-shell-linux64.zip \
             https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.77/linux64/chrome-headless-shell-linux64.zip
          sha256=$(sha256sum release-assets/browser/chrome-headless-shell-linux64.zip | cut -d' ' -f1)
           printf '{"version":"151.0.7922.77","platform":"linux64","url":"https://storage.googleapis.com/chrome-for-testing-public/151.0.7922.77/linux64/chrome-headless-shell-linux64.zip","sha256":"%s"}\n' "$sha256" > release-assets/browser/chrome-headless-shell-manifest.json
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" release-assets/*.tar.gz release-assets/browser/* --clobber

  npm-publish:
    needs: [assets, release-please]
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - name: build gallery
        run: bun run build
      # v4.4.0 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          registry-url: "https://registry.npmjs.org"
      - name: publish package
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public
      - name: skip npm publish (NPM_TOKEN is absent)
        if: env.NPM_TOKEN == ''
        run: 'echo "Skipping npm publish: NPM_TOKEN is not configured"'

  npm-publish-retry:
    if: ${{ inputs.tag != '' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    env:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.4.0
      - name: validate and check out release tag
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="$RELEASE_TAG"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $TAG (expected vX.Y.Z)" >&2
            exit 1
          fi
          git fetch --force --tags origin
          if ! git show-ref --tags --verify --quiet "refs/tags/$TAG"; then
            echo "Release tag does not exist: $TAG" >&2
            exit 1
          fi
          git checkout --detach "$TAG"
          PACKAGE_VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json', 'utf8')).version")
          if [[ "$PACKAGE_VERSION" != "${TAG#v}" ]]; then
            echo "Tag $TAG points to package version $PACKAGE_VERSION" >&2
            exit 1
          fi
      - run: bun install --frozen-lockfile
      - name: build gallery
        run: bun run build
      # v4.4.0 — 49933ea5288caeca8642d1e84afbd3f7d6820020
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          registry-url: "https://registry.npmjs.org"
      - name: publish package
        if: env.NPM_TOKEN != ''
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --provenance --access public

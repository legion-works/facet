name: release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v4.2.0 — a02a34c4d625f9be7cb89156071d8567266a2445
      - id: release
        uses: googleapis/release-please-action@a02a34c4d625f9be7cb89156071d8567266a2445
        with:
          release-type: node
  assets:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v2.0.2 — 735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: build release archives and pinned browser manifest
        env:
          RELEASE_TAG: ${{ needs.release-please.outputs.tag_name }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p release-assets/browser
          tar -czf "release-assets/facet-${RELEASE_TAG}-source.tar.gz" --exclude=.git --exclude=release-assets .
          tar -czf "release-assets/facet-${RELEASE_TAG}-gallery.tar.gz" dist/gallery
          curl -fsSL -o release-assets/browser/chrome-headless-shell-linux64.zip \
            https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip
          sha256=$(sha256sum release-assets/browser/chrome-headless-shell-linux64.zip | cut -d' ' -f1)
          printf '{"version":"131.0.6778.204","platform":"linux64","url":"https://storage.googleapis.com/chrome-for-testing-public/131.0.6778.204/linux64/chrome-headless-shell-linux64.zip","sha256":"%s"}\n' "$sha256" > release-assets/browser/chrome-headless-shell-manifest.json
      - name: upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG_NAME" release-assets/*.tar.gz release-assets/browser/* --clobber

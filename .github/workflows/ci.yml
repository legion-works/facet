name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  static:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-bun
      - id: format
        name: format
        run: bun run format:check
      - id: lint
        name: lint
        run: bun run lint
      - id: typecheck
        name: typecheck
        run: bun run typecheck
      - id: boundaries
        name: service boundaries
        run: bun run check:boundaries
      - name: summarize static gates
        if: always()
        shell: bash
        env:
          FORMAT: ${{ steps.format.outcome }}
          LINT: ${{ steps.lint.outcome }}
          TYPECHECK: ${{ steps.typecheck.outcome }}
          BOUNDARIES: ${{ steps.boundaries.outcome }}
        run: |
          {
            echo '## Static gates'
            echo
            echo '| Gate | Result |'
            echo '| --- | --- |'
            echo "| format | ${FORMAT:-not-run} |"
            echo "| lint | ${LINT:-not-run} |"
            echo "| typecheck | ${TYPECHECK:-not-run} |"
            echo "| service boundaries | ${BOUNDARIES:-not-run} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # Catches a flaky test AS IT IS INTRODUCED — the only flake still cheap to
  # prevent. Deterministic by construction: it stresses only test files the diff
  # modified, and excludes tests/acceptance (browser flakiness is a runtime
  # property, so stressing it would measure Bun rather than the change).
  changed-test-stress:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-bun
      - name: permit Tier 0 network namespaces
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --map-current-user --user --net -- /bin/true
      - name: stress changed tests
        shell: bash
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "SKIP no usable base ref (first push on this ref)" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          bun scripts/stress-changed-tests.ts "$base" | tee -a "$GITHUB_STEP_SUMMARY"

  unit:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-bun
      - id: tests
        name: unit tests
        run: |
          mkdir -p test-results
          bun test tests/unit/ --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=test-results/unit.xml
      - name: summarize unit tests
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/unit.xml ]]; then
            bun scripts/summarize-junit.ts test-results/unit.xml unit
          else
            printf '## unit tests\n\n✗ Tests did not start; inspect setup steps.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: publish unit coverage input
        if: steps.tests.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-unit
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: upload unit failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unit-failure-evidence
          path: |
            test-results/unit.xml
            coverage/
          if-no-files-found: warn
          retention-days: 7

  integration:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-bun
      - name: permit Tier 0 network namespaces
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --map-current-user --user --net -- /bin/true
      - id: tests
        name: integration tests
        run: |
          mkdir -p test-results
          bun test tests/integration/ --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile=test-results/integration.xml
      - name: summarize integration tests
        if: always()
        shell: bash
        run: |
          if [[ -f test-results/integration.xml ]]; then
            bun scripts/summarize-junit.ts test-results/integration.xml integration
          else
            printf '## integration tests\n\n✗ Tests did not start; inspect setup steps.\n' >> "$GITHUB_STEP_SUMMARY"
          fi
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: publish integration coverage input
        if: steps.tests.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-integration
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: upload integration failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: integration-failure-evidence
          path: |
            test-results/integration.xml
            coverage/
          if-no-files-found: warn
          retention-days: 7

  security:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - id: gitleaks
        name: gitleaks v8.30.1
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          if [[ "${{ github.event_name }}" == "push" ]]; then
            gitleaks git --redact --no-banner --report-format sarif --report-path gitleaks.sarif
          else
            gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --no-banner --report-format sarif --report-path gitleaks.sarif
          fi
      - name: summarize secret scan
        if: always()
        shell: bash
        env:
          RESULT: ${{ steps.gitleaks.outcome }}
        run: printf '## Secret scan\n\n%s gitleaks · %s\n' "$([[ "$RESULT" == success ]] && echo '✓' || echo '✗')" "${RESULT:-not-run}" >> "$GITHUB_STEP_SUMMARY"
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: upload secret-scan evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: security-failure-evidence
          path: gitleaks.sarif
          if-no-files-found: warn
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-bun
      - id: gallery
        name: gallery build
        run: bun run build
      - id: adapters
        name: adapter size contract
        run: bun run verify-adapter-size
      - name: summarize build gates
        if: always()
        shell: bash
        env:
          BUILD: ${{ steps.gallery.outcome }}
          ADAPTERS: ${{ steps.adapters.outcome }}
        run: |
          printf '## Build\n\n- gallery: %s\n- adapter size: %s\n' "${BUILD:-not-run}" "${ADAPTERS:-not-run}" >> "$GITHUB_STEP_SUMMARY"

  performance:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-bun
      # actions/cache v4.3.0 — 0057852bfaa89a56745cba8c7296529d2fc39830
      - name: restore pinned browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ runner.arch }}-chrome-headless-shell-151.0.7922.77
      - name: install pinned chrome-headless-shell
        run: bunx --bun puppeteer browsers install chrome-headless-shell@151.0.7922.77
      - name: permit Chromium nested user namespaces
        shell: bash
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare --map-current-user --user --net -- /bin/true
      - id: perf
        name: measure performance
        env:
          FACET_PERF_JSON: test-results/performance.json
        run: bun run perf-gate -- --ci
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: upload performance measurements
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: performance-measurements
          path: test-results/performance.json
          if-no-files-found: warn
          retention-days: 14

  acceptance-tier1:
    # Depend ONLY on the jobs that make acceptance MEANINGLESS if they fail:
    # `static` (it cannot typecheck, so the code under test is not the code we
    # think) and `build` (acceptance loads dist/gallery). The others were cost
    # control — cheaper-to-run-first is not a reason for a hard dependency, and
    # treating it as one has a failure mode we hit on af46b64: a browser-launch
    # flake in `performance` (oven-sh/bun#37230 on the pinned runtime) reported
    # as "acceptance never ran" rather than "performance is flaky", hiding the
    # real signal behind a skip. A flaky sibling must not be able to silence the
    # acceptance gate.
    needs: [static, build]
    runs-on: ubuntu-latest
    # The Bun CDP-pipe fd-reuse trigger is pattern-sensitive, so a shared safe
    # group would have to be re-derived whenever an acceptance file changes.
    # One file per leg makes every failure attributable and contains a wedge.
    strategy:
      fail-fast: false
      matrix:
        test:
          - _repro-browser-lifecycle.test.ts
          - adversarial-render.test.ts
          - canvas-chart-tier1.test.ts
          - csp-consumer-baseline.test.ts
          - egress.test.ts
          - gallery-contrast.test.ts
          - gallery-daisyui-library.test.ts
          - gallery-html-scroll.test.ts
          - gallery-interactive-tsx.test.ts
          - gallery-refresh.test.ts
          - gallery-render.test.ts
          - gallery-geometry.test.ts
          - gallery-mermaid-natural.test.ts
          - gallery-static-tsx.test.ts
          - gallery-tsx-styles.test.ts
          - gallery-tsx-styles-templates.test.ts
          - gallery-viewport-geometry.test.ts
          - gate-forgery.test.ts
          - harness-recovery.test.ts
          - html-differential.test.ts
          - html-harness-csp.test.ts
          - html-render.test.ts
          - html-tier1-status.test.ts
          - insecure-sandbox.test.ts
          - markdown-mermaid-labels.test.ts
          - runtime-exception-event.test.ts
          - screenshot-evidence-failure.test.ts
          - secure-cli-tier1.test.ts
          - tsx-interactive-verdict-empty.test.ts
          - tsx-interactive-verdict-non-component.test.ts
          - tsx-interactive-verdict-rejected.test.ts
          - tsx-interactive-verdict-stable.test.ts
          - tsx-interactive-verdict-starter.test.ts
          - tsx-interactive-verdict-throwing.test.ts
          - tsx-interactive-verdict-unstable.test.ts
          - tsx-interactive.test.ts
          - tsx-measurement.test.ts
          - tsx-nested-frame-selection.test.ts
          - tsx-runtime-egress.test.ts
          - tsx-screenshot-evidence.test.ts
          - tsx-static.test.ts
    name: acceptance-tier1 (${{ matrix.test }})
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: ./.github/actions/setup-bun
      # actions/cache v4.3.0 — 0057852bfaa89a56745cba8c7296529d2fc39830
      - id: browser-cache
        name: restore pinned browser
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ runner.arch }}-chrome-headless-shell-151.0.7922.77
      - id: browser-install
        name: install pinned chrome-headless-shell
        run: bunx --bun puppeteer browsers install chrome-headless-shell@151.0.7922.77
      - id: sandbox
        name: permit Chromium nested user namespaces
        shell: bash
        run: |
          sysctl kernel.apparmor_restrict_unprivileged_userns
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns
          unshare --map-current-user --user --net -- /bin/true
      - id: tests
        name: Tier 1 acceptance test
        run: |
          mkdir -p test-results
          bun test "tests/acceptance/${{ matrix.test }}" --coverage --coverage-reporter=lcov --reporter=junit --reporter-outfile="test-results/acceptance-${{ matrix.test }}.xml"
      - name: summarize Tier 1 acceptance
        if: always()
        shell: bash
        env:
          CACHE_HIT: ${{ steps.browser-cache.outputs.cache-hit }}
          BROWSER_INSTALL: ${{ steps.browser-install.outcome }}
          SANDBOX: ${{ steps.sandbox.outcome }}
        run: |
          {
            echo '## Tier 1 environment'
            echo
            echo "- browser cache: ${CACHE_HIT:-false}"
            echo "- browser install: ${BROWSER_INSTALL:-not-run}"
            echo "- nested user namespaces: ${SANDBOX:-not-run}"
          } >> "$GITHUB_STEP_SUMMARY"
          if [[ -f "test-results/acceptance-${{ matrix.test }}.xml" ]]; then
            bun scripts/summarize-junit.ts "test-results/acceptance-${{ matrix.test }}.xml" "acceptance-tier1 (${{ matrix.test }})"
          else
            printf '\n## acceptance-tier1 (%s) tests\n\n✗ Tests did not start; inspect browser setup.\n' "${{ matrix.test }}" >> "$GITHUB_STEP_SUMMARY"
          fi
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: publish acceptance coverage input
        if: steps.tests.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-acceptance-${{ matrix.test }}
          path: coverage/lcov.info
          if-no-files-found: error
          retention-days: 1
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: upload acceptance failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: acceptance-failure-evidence-${{ matrix.test }}
          path: |
            test-results/acceptance-${{ matrix.test }}.xml
            coverage/
          if-no-files-found: warn
          retention-days: 7
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      # The two-viewport geometry gate's ten PNGs are the visual proof
      # behind every scrollWidth/scrollHeight/columnCount assertion —
      # uploaded on both success and failure so a passing run still
      # leaves the pixels an operator can spot-check.
      - name: upload gallery geometry screenshots
        if: always() && matrix.test == 'gallery-viewport-geometry.test.ts'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gallery-geometry-screenshots
          path: test-results/gallery-geometry/**
          if-no-files-found: warn
          retention-days: 14

  coverage:
    needs: [unit, integration, acceptance-tier1]
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # v2.0.2 — 735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      # v8.0.1 — 3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          pattern: coverage-*
          path: coverage-input
      - name: enforce aggregate and per-file coverage
        shell: bash
        run: |
          coverage_inputs=(
            coverage-input/coverage-unit/lcov.info
            coverage-input/coverage-integration/lcov.info
            coverage-input/coverage-acceptance-*/lcov.info
          )
          bun scripts/check-coverage.ts "${coverage_inputs[@]}"
      # v4.6.2 — ea165f8d65b6e75b540449e92b4886f43607fa02
      - name: upload coverage failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: coverage-failure-evidence
          path: coverage-input/
          if-no-files-found: error
          retention-days: 7

name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      # v4.2.2 — 11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      # v2.0.2 — 735343b667d3e6f658f44d0eca948eb6282f2b76
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      # actions/cache v4.3.0 — 0057852bfaa89a56745cba8c7296529d2fc39830 (<= v4.1.x hard-fails at job setup: deprecated cache toolkit, 2024-12-05 deprecation)
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-chrome-headless-shell-131.0.6778.204
      - name: install pinned chrome-headless-shell
        run: bunx --bun puppeteer browsers install chrome-headless-shell@131.0.6778.204
      - name: permit Chromium nested user namespaces
        shell: bash
        run: |
          # Ubuntu-hosted runners restrict unprivileged user namespaces with AppArmor.
          # Chromium's own sandbox needs nested user namespaces; keep that sandbox enabled
          # and relax only the runner-wide restriction before launching the browser.
          sysctl kernel.apparmor_restrict_unprivileged_userns || true
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          sysctl kernel.apparmor_restrict_unprivileged_userns
          unshare --map-current-user --user --net -- /bin/true
      - name: diagnose Tier 0 worker lifecycle
        shell: bash
        run: |
          # This probe is diagnostic only: capture whether enabling nested user namespaces
          # makes the lazy service's Tier 0 worker unavailable or kill the service.
          set +e
          echo "plain netns probe:"
          unshare --map-current-user --net -- /bin/true
          echo "plain netns exit: $?"
          home="$(mktemp -d)"
          stderr_file="$(mktemp)"
          create_file="$(mktemp)"
          FACET_HOME="$home" timeout 45s bun src/cli/main.ts create --project-id /ci --slug userns-probe --title userns-probe --json >"$create_file" 2>"$stderr_file"
          echo "create exit: $?"
          echo "service stderr:"
          cat "$stderr_file"
          artifact_id="$(jq -r '.data.artifact.id // empty' "$create_file")"
          echo "artifact id: ${artifact_id:-<none>}"
          start_ms="$(date +%s%3N)"
          printf 'graph TD\n  A --> B\n' | FACET_HOME="$home" timeout 45s bun src/cli/main.ts publish --artifact-id "$artifact_id" --type mermaid --file - --json >>"$create_file" 2>>"$stderr_file"
          publish_exit=$?
          end_ms="$(date +%s%3N)"
          echo "publish exit: $publish_exit"
          echo "publish duration ms: $((end_ms - start_ms))"
          echo "publish output:"
          tail -n 5 "$create_file"
          echo "service stderr after publish:"
          cat "$stderr_file"
          lock_file="$(find "$home" -name facet.lock -print -quit)"
          if [[ -n "$lock_file" ]]; then
            jq '{pid, port}' "$lock_file"
            pid="$(jq -r '.pid // empty' "$lock_file")"
            if [[ -n "$pid" ]]; then kill -0 "$pid" 2>/dev/null; echo "service alive exit: $?"; fi
          else
            echo "service lock: <none>"
          fi
          exit 0
      - run: bun run format:check
      - run: bun run lint
      - run: bun run typecheck
      - run: bun run check:boundaries
      - name: install gitleaks v8.30.1
        shell: bash
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o /tmp/gitleaks.tar.gz
          echo '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  /tmp/gitleaks.tar.gz' | sha256sum --check --strict
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
      - name: gitleaks full history on push, PR range on pull request
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" ]]; then
            gitleaks git --redact --no-banner
          else
            gitleaks git --log-opts="${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}" --redact --no-banner
          fi
      - run: bun test tests/unit tests/integration
      - run: bun test --coverage --coverage-reporter=lcov
      - run: bun run coverage:check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: coverage-lcov
          path: coverage/
          if-no-files-found: error
      - run: bun run perf-gate
      - run: bun run build
      - run: bun run verify-adapter-size

name: setup Bun workspace
description: Install the pinned Bun toolchain and restore its package cache
runs:
  using: composite
  steps:
    # v2.0.2 — 735343b667d3e6f658f44d0eca948eb6282f2b76
    #
    # 1.4.0+: fd-reuse bug oven-sh/bun#37230 fixed; do not regress below 1.4.0.
    - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76
      with:
        bun-version: 1.4.0
    # actions/cache v4.3.0 — 0057852bfaa89a56745cba8c7296529d2fc39830
    - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ runner.arch }}-1.4.0-${{ hashFiles('bun.lock') }}
    - name: install dependencies
      shell: bash
      run: bun install --frozen-lockfile

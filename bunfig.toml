[test]
coverageReporter = ["text", "lcov"]
coverageDir = "coverage"
# Coverage enforcement lives in scripts/check-coverage.ts so a test command's
# exit status reports test failures only. CI merges tier LCOV before applying
# the aggregate and per-file floors.
# Netns subprocess code is invisible to in-process instrumentation; mandatory
# egress, forgery, and adversarial-render acceptance gates cover these paths.
# Browser runtime files execute outside Bun's process; gallery SSE integration
# plus adversarial-render and forgery acceptance gates cover their behavior.
coveragePathIgnorePatterns = [
  "dist/",
  # compileTsx workspaces are gitignored transient bundles that vendor React.
  ".facet-tsx-worker/compile-*/out/artifact.js",
  "**/main.ts",
  "src/validation/sandbox/netns.ts",
  "src/validation/tier0/runner.ts",
  "src/validation/tier1/browser-process.ts",
  "src/validation/tier1/cdp-pipe.ts",
  "src/validation/tier1/runner.ts",
  "src/gallery-web/sse-client.ts",
  "src/gallery-web/frame/renderers/mermaid.ts",
  "src/gallery-web/frame/renderers/registry.ts",
  "tests/helpers/**",
]
